name: Compilar APK Lumina

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema en Linux
        run: |
          sudo apt update
          sudo apt install -y clang ninja-build libgtk-3-dev

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Java JDK (Requerido para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flet y librerías de Python
        run: |
          python -m pip install --upgrade pip
          pip install flet tinytuya

      - name: Compilar APK con Flet
        env:
          CI: 'true'
        run: flet build apk --verbose
        working-directory: mobile

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-Android
          path: |
            mobile/build/apk/*.apk
            mobile/build/app/outputs/apk/release/*.apk
