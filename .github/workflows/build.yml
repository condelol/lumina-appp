name: Compilar APK Lumina

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias de Linux necesarias por Flet
        run: |
          sudo apt update
          sudo apt install -y clang ninja-build libgtk-3-dev

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter (versión fija)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Instalar Flet y librerías
        run: |
          python -m pip install --upgrade pip
          pip install flet tinytuya

      - name: Compilar APK con Flet (no interactivo)
        run: flet build apk --no-interactive --verbose
        working-directory: mobile

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-Android
          path: |
            mobile/build/apk/*.apk
            mobile/build/app/outputs/apk/release/*.apk
